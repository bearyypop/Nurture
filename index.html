<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, inital-scale=1.0">
    <meta name="" description" content="A fan page tributed to Porter Robinson's Nurture album.">
    <title>Nurture</title>

    <!--Favicon-->
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <!--font link-->
    <link rel="stylesheet" href="https://use.typekit.net/fky8cpo.css">

    <!--links to CSS and JS-->
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <!--logo images for both light and dark mode-->
        <div class="logo-imgs">
        <img src="images/porter light logo.png" alt="Porter Robinson laying face down in a field of mustard flowers" class="logo-light">
        <img src="images/porter dark logo.png" alt="Porter Robinson laying face up in a dark grassy field" class="logo-dark">
        </div>
        <div class="logo-text">
            <span>NURTURE</span>
        </div>
        <nav>
            <ul class="navList">
                <li><a href="#home">HOME</a></li>
                <li><a href="#moments">MOMENTS</a></li>
                <li><a href="#tracks">TRACKS</a></li>
                <li><a href="#connect">CONNECT</a></li>
            </ul>
        </nav>
        <!--dark mode button-->
        <button id="dark-toggle" type="button">Dark Mode</button>
    </header>
    <main>
        <!--Home Page-->
        <section class="hero" id="home">
            <!--background images for light and dark mode-->
            <div class="hero-imgs">
                <img src="images/light mode bg.png" alt="grassy field with small white flowers" class="hero-light">
                <img src="images/background dark mode.png" alt="dark forest with a ray of sun shining through" class="hero-dark">
            </div>
            <div class="hero-text">
                <h1>NURTURE</h1>
                <h2>PORTER ROBINSON</h2>
                <!--explore button-->
                <a href="#moments" class="explore-btn">EXPLORE</a>
                <!--scroll down arrow-->
                <div class="scroll-down">↓</div>
            </div>
        </section>

        <!--Carousel-->
        <section class="moments">
            <h2 class="moments-header">MOMENTS</h2>
            
        </section>
    </main>
    <footer></footer>
</body>

</html>
