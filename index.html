<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, inital-scale=1.0">
    <meta name="description" content="A fan page tributed to Porter Robinson's Nurture album.">
    <title>Nurture</title>

    <!--Favicon-->
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <!--font link-->
    <link rel="stylesheet" href="https://use.typekit.net/fky8cpo.css">

    <!--links to CSS and JS-->
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <!--logo images for both light and dark mode-->
        <div class="logo-imgs">
        <img src="images/porter light logo.png" alt="Porter Robinson laying face down in a field of mustard flowers" class="logo-light">
        </div>
        <div class="logo-text">
            <span>NURTURE</span>
        </div>
        <nav>
            <ul class="navList">
                <li><a href="#home">HOME</a></li>
                <li><a href="#moments">MOMENTS</a></li>
                <li><a href="#tracks">TRACKS</a></li>
                <li><a href="#connect">CONNECT</a></li>
            </ul>
        </nav>

    </header>
    <main>
        <!--Home Page-->
        <section class="hero" id="home">
            <!--background image-->
            <div class="hero-imgs">
                <img src="images/light mode bg.png" alt="grassy field with small white flowers" class="hero-light">
            </div>
            <div class="hero-text">
                <h1>NURTURE</h1>
                <h2>PORTER ROBINSON</h2>
                <!--explore button-->
                <a href="#moments" class="explore-btn">EXPLORE</a>
                <!--scroll down arrow-->
                <div class="scroll-down">↓</div>
            </div>
        </section>

        <!--Carousel-->
        <section class="moments" id="moments">
            <h2 class="moments-header">MOMENTS</h2>
            <div class="carousel">
              <button class="carousel-prev-btn"  type="button" aria-label="Previous Moment"><img src="images/potaro.png" alt=""></button>
            </div>
            <div class="carousel-collection">
                <img src="images/porter robinson landscape.jpg" alt="Porter Robinson running across a large lush green grass with clear blue skies." id="carousel-img">
            </div>
        </section>
    </main>
    <footer></footer>
</body>

</html>
